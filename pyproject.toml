[project]
name = "rebble-auth"
version = "0.1.0"
description = "Rebble auth!"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-oauthlib>=0.9.6",
    "flask-sqlalchemy>=3.1.1",
    "flask-sslify>=0.1.5",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "honeycomb-beeline>=3.6.0",
    "oauthlib>=2.1.0",
    "psycopg2-binary>=2.9.13",
    "pydiscourse>=1.7.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "stripe>=16.0.0",
    "wrapt>=1.17.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
