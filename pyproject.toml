[project]
name = "rebble-auth"
version = "0.1.0"
description = "Rebble auth!"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "authlib>=1.9.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-oauthlib>=0.9.6",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-flask>=0.66b1",
    "opentelemetry-instrumentation-jinja2>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg[binary]>=3.3.6",
    "pydiscourse>=1.7.0",
    "pyjwt>=2.15.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0,<2.1",
    "stripe>=16.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
